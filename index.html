<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UZI1890 | Dijital Merkez</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#01050d;
  --panel:#050c17;
  --panel2:#071221;
  --blue:#008cff;
  --cyan:#00d9ff;
  --text:#eef7ff;
  --muted:#8798ae;
  --border:rgba(0,140,255,.30);
}

body{
  background:
    radial-gradient(circle at 50% 10%,rgba(0,120,255,.13),transparent 35%),
    radial-gradient(circle at 50% 100%,rgba(0,210,255,.07),transparent 40%),
    #01050d;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}

button{
  font:inherit;
}

a{
  text-decoration:none;
  color:inherit;
}

/* ANA YAPI */

.app{
  width:min(1450px,100%);
  margin:auto;
  display:grid;
  grid-template-columns:220px 1fr 220px;
  gap:12px;
  min-height:100vh;
  padding:14px;
}

/* SOL MENÜ */

.sidebar{
  border:1px solid var(--border);
  border-radius:18px;
  background:rgba(3,10,19,.94);
  box-shadow:
    0 0 20px rgba(0,140,255,.13),
    inset 0 0 30px rgba(0,100,255,.025);
  padding:18px 12px;
  display:flex;
  flex-direction:column;
}

.logo{
  text-align:center;
  padding:15px 5px 22px;
  color:var(--cyan);
  font-size:26px;
  font-weight:800;
  letter-spacing:2px;
  text-shadow:0 0 15px rgba(0,200,255,.8);
}

.menu{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.menu a{
  padding:13px 12px;
  border-radius:10px;
  color:#b9c9dc;
  display:flex;
  align-items:center;
  gap:12px;
  transition:.2s;
  cursor:pointer;
}

.menu a:hover,
.menu a.active{
  color:white;
  background:linear-gradient(90deg,rgba(0,130,255,.22),rgba(0,80,180,.05));
  box-shadow:inset 3px 0 var(--blue),0 0 15px rgba(0,120,255,.08);
}

.icon{
  width:25px;
  text-align:center;
  font-size:18px;
}

.separator{
  height:1px;
  background:rgba(130,160,190,.13);
  margin:14px 5px;
}

.sidebar-bottom{
  margin-top:auto;
  padding:16px 8px 4px;
  text-align:center;
  border:1px solid rgba(0,150,255,.22);
  border-radius:14px;
  background:rgba(0,80,180,.05);
}

.crown{
  font-size:28px;
  color:#55cfff;
  text-shadow:0 0 15px #008cff;
}
